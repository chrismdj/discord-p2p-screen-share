<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0a1020">
    <title>Compartilhar Tela</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <header class="site-header">
        <a class="wordmark" href="./" aria-label="Compartilhar Tela">COMPARTILHAR <span>TELA</span></a>
        <span id="status" role="status">Preparando conexão…</span>
      </header>
      <section id="join-card" class="join-panel">
        <div class="join-number">01</div>
        <div><h1>Entre na sala.</h1><p>Assista às telas dos seus amigos ou abra a sua para a turma. Tudo acontece no navegador.</p></div>
        <label>Como podemos chamar você?<input id="name" maxlength="24" placeholder="Seu nome" autocomplete="name"></label>
        <button id="join" class="button button-primary">Entrar na sala</button>
        <p id="join-error" class="notice" aria-live="polite"></p>
        <p class="hint">O anfitrião entra primeiro. A sala aceita até quatro pessoas.</p>
      </section>
      <section id="room" hidden>
        <div class="room-intro">
          <div><p class="room-kicker" id="room-label">Sala</p><h1>Sala ao vivo</h1><p id="participant-count" class="participant-count">0 participantes</p></div>
          <div class="room-actions">
            <button id="grid" class="button button-subtle" type="button" aria-pressed="true">Grade</button>
            <label class="quality">Qualidade<select id="quality" aria-label="Qualidade de compartilhamento"><option value="720">720p · 30 fps</option><option value="1080">1080p · 30 fps</option></select></label>
            <button id="share" class="button button-primary">Compartilhar tela</button><button id="leave" class="button button-subtle">Sair</button>
          </div>
        </div>
        <p id="notice" class="notice room-notice" aria-live="polite"></p>
        <div class="stage-label"><span>TRANSMISSÕES</span><span id="layout-hint">Escolha uma live para focar</span></div>
        <div id="screens" class="screens"></div>
      </section>
    </main>
    <template id="screen-template">
      <article class="screen"><div class="screen-title"><span class="live-indicator"><i></i><span class="screen-state">Aguardando</span></span><strong></strong><div class="screen-tools"><button class="tool-button focus" type="button" aria-pressed="false">Focar</button><button class="tool-button mute" type="button" aria-pressed="false">Silenciar</button><button class="tool-button up" type="button">Mover antes</button><button class="tool-button down" type="button">Mover depois</button><button class="tool-button fullscreen" type="button">Tela cheia</button></div></div><video autoplay playsinline></video><p class="empty">Aguardando compartilhamento</p></article>
    </template>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script type="module" src="./app.js?v=premium-room-1"></script>
  </body>
</html>
